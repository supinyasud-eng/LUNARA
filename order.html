<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ — LUNARA</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .order-wrap {
      max-width: 560px;
      margin: 0 auto;
    }

    .order-wrap textarea {
      resize: vertical;
      min-height: 90px;
    }

    .order-wrap .btn {
      width: 100%;
      margin-top: var(--space-3);
    }

    .order-wrap .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Lunara</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="hero" style="padding: var(--space-6) 0 var(--space-4);">
      <div class="container fade-in">
        <span class="eyebrow">Order</span>
        <h1 style="font-size: clamp(2rem, 5vw, 3.25rem);">สั่งซื้อสินค้า</h1>
        <hr class="rule">
        <p class="lead">กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อของคุณ</p>
      </div>
    </section>

    <section class="section" style="padding-top: var(--space-4);">
      <div class="container">
        <form id="orderForm" class="order-wrap">

          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" required autocomplete="name">
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" required autocomplete="tel">
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" required inputmode="decimal">
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn--solid">ยืนยันสั่งซื้อ</button>

        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="index.html" class="logo">Lunara</a>
      <ul class="footer-links">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
      <p>&copy; LUNARA. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
